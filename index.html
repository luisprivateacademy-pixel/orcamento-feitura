<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Orçamento de Feitura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #f5efe2;
    --bg-paper: #faf6ec;
    --ink: #1f1a14;
    --ink-soft: #5a4f3f;
    --line: #d9cdb3;
    --line-soft: #ece1c8;
    --accent: #b8893a;       /* dourado Oxum */
    --accent-deep: #8a6420;
    --green: #4a7c4e;        /* menor preço */
    --green-bg: #d8e8d4;
    --red: #8b3a2b;
    --shadow: 0 1px 0 rgba(31,26,20,0.04), 0 6px 18px rgba(31,26,20,0.06);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    background-image:
      radial-gradient(circle at 10% 0%, rgba(184,137,58,0.06) 0%, transparent 40%),
      radial-gradient(circle at 90% 100%, rgba(184,137,58,0.05) 0%, transparent 40%);
    min-height: 100vh;
  }
  .app {
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px 20px 120px;
  }
  header {
    text-align: center;
    padding: 20px 0 28px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 24px;
  }
  header h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: clamp(28px, 5vw, 42px);
    letter-spacing: 0.02em;
    margin: 0;
    color: var(--ink);
  }
  header h1 .ornament {
    color: var(--accent);
    font-style: italic;
    font-weight: 500;
  }
  header p {
    margin: 6px 0 0;
    color: var(--ink-soft);
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* SUMMARY */
  .summary {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }
  .stat {
    background: var(--bg-paper);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px 16px;
    box-shadow: var(--shadow);
  }
  .stat .label {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }
  .stat .value {
    font-family: 'Cormorant Garamond', serif;
    font-size: 24px;
    font-weight: 600;
    color: var(--ink);
  }
  .stat .value.green { color: var(--green); }
  .stat .value.gold { color: var(--accent-deep); }

  /* TOOLBAR */
  .toolbar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 12px;
    align-items: center;
  }
  .btn {
    background: var(--bg-paper);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 8px 14px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn:hover { background: #fff; border-color: var(--accent); }
  .btn.primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .btn.primary:hover { background: var(--accent-deep); border-color: var(--accent-deep); }
  .btn.danger { color: var(--red); }
  .btn.danger:hover { background: #fff; border-color: var(--red); }
  .modal .btn.danger {
    background: var(--red);
    color: #fff;
    border-color: var(--red);
  }
  .modal .btn.danger:hover {
    background: #6a2a1f;
    border-color: #6a2a1f;
    color: #fff;
  }

  /* TABLE */
  .table-wrap {
    background: var(--bg-paper);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
    box-shadow: var(--shadow);
    margin-bottom: 24px;
  }
  .table-scroll { overflow-x: auto; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    min-width: 700px;
  }
  thead th {
    background: #efe6d2;
    color: var(--ink);
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 10px 8px;
    text-align: left;
    border-bottom: 1px solid var(--line);
    border-right: 1px solid var(--line-soft);
    position: sticky;
    top: 0;
  }
  thead th:last-child { border-right: none; }
  thead th.col-item { width: 32%; min-width: 200px; }
  thead th.col-qty { width: 70px; }
  thead th.col-store { width: 14%; min-width: 110px; }
  thead th.col-actions { width: 50px; }

  .store-name-input {
    background: transparent;
    border: none;
    font: inherit;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink);
    width: 100%;
    padding: 0;
    outline: none;
    border-bottom: 1px dashed transparent;
  }
  .store-name-input:hover, .store-name-input:focus {
    border-bottom-color: var(--accent);
  }

  tbody tr {
    border-bottom: 1px solid var(--line-soft);
  }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: rgba(184,137,58,0.04); }
  tbody td {
    padding: 6px 8px;
    border-right: 1px solid var(--line-soft);
    vertical-align: middle;
  }
  tbody td:last-child { border-right: none; }

  .cell-input {
    background: transparent;
    border: none;
    font: inherit;
    color: var(--ink);
    width: 100%;
    padding: 6px 4px;
    outline: none;
    border-radius: 4px;
  }
  .cell-input:focus {
    background: #fff;
    box-shadow: inset 0 0 0 1px var(--accent);
  }
  .cell-input.qty { text-align: center; }
  .cell-input.price { text-align: right; font-variant-numeric: tabular-nums; }

  td.price-cell { padding: 0; }
  td.price-cell.lowest {
    background: var(--green-bg);
    position: relative;
  }
  td.price-cell.lowest::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: var(--green);
  }
  td.price-cell.lowest .cell-input { color: var(--green); font-weight: 600; }

  .row-action-btn {
    background: transparent;
    border: none;
    color: var(--ink-soft);
    cursor: pointer;
    font-size: 16px;
    padding: 4px 8px;
    border-radius: 4px;
  }
  .row-action-btn:hover { color: var(--red); background: rgba(139,58,43,0.1); }

  /* CHAT */
  .chat-fab {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    border: none;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(138,100,32,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    z-index: 100;
    transition: transform 0.2s;
  }
  .chat-fab:hover { transform: scale(1.05); background: var(--accent-deep); }

  .chat-panel {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 380px;
    max-width: calc(100vw - 24px);
    height: 560px;
    max-height: calc(100vh - 40px);
    background: var(--bg-paper);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(31,26,20,0.2);
    display: flex;
    flex-direction: column;
    z-index: 200;
    overflow: hidden;
  }
  .chat-header {
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #efe6d2;
  }
  .chat-header h3 {
    margin: 0;
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    font-weight: 600;
  }
  .chat-header button {
    background: transparent; border: none; cursor: pointer;
    font-size: 20px; color: var(--ink-soft); padding: 4px 8px;
    border-radius: 4px;
  }
  .chat-header button:hover { background: rgba(0,0,0,0.05); }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    padding: 10px 12px;
    border-radius: 10px;
    max-width: 85%;
    font-size: 13px;
    line-height: 1.45;
    word-wrap: break-word;
  }
  .msg.user {
    background: var(--accent);
    color: #fff;
    align-self: flex-end;
    border-bottom-right-radius: 2px;
  }
  .msg.ai {
    background: #fff;
    border: 1px solid var(--line);
    align-self: flex-start;
    border-bottom-left-radius: 2px;
  }
  .msg.system {
    background: transparent;
    color: var(--ink-soft);
    font-style: italic;
    font-size: 11px;
    text-align: center;
    align-self: center;
    max-width: 100%;
  }
  .msg img { max-width: 100%; border-radius: 6px; margin-top: 6px; display: block; }
  .msg .actions-applied {
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px solid var(--line-soft);
    font-size: 11px;
    color: var(--ink-soft);
  }
  .msg .actions-applied div { margin-top: 2px; }

  .typing { display: inline-flex; gap: 3px; padding: 4px 0; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--ink-soft);
    animation: typing 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typing {
    0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-3px); }
  }

  .chat-input-area {
    border-top: 1px solid var(--line);
    padding: 10px;
    display: flex;
    gap: 6px;
    align-items: flex-end;
    background: #fff;
  }
  .chat-input {
    flex: 1;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
    font: inherit;
    font-size: 13px;
    resize: none;
    min-height: 36px;
    max-height: 100px;
    outline: none;
  }
  .chat-input:focus { border-color: var(--accent); }
  .chat-btn-icon {
    background: var(--accent);
    color: #fff;
    border: none;
    width: 36px;
    height: 36px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .chat-btn-icon:hover { background: var(--accent-deep); }
  .chat-btn-icon.secondary {
    background: transparent;
    color: var(--ink-soft);
    border: 1px solid var(--line);
  }
  .chat-btn-icon.secondary:hover { background: var(--line-soft); }

  .image-preview {
    padding: 8px 10px;
    border-top: 1px solid var(--line);
    background: #fff;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--ink-soft);
  }
  .image-preview img { width: 40px; height: 40px; object-fit: cover; border-radius: 4px; }

  /* API KEY MODAL */
  .modal-bg {
    position: fixed; inset: 0;
    background: rgba(31,26,20,0.5);
    display: flex; align-items: center; justify-content: center;
    z-index: 300; padding: 20px;
  }
  .modal {
    background: var(--bg-paper);
    border-radius: 12px;
    padding: 24px;
    max-width: 440px;
    width: 100%;
    border: 1px solid var(--line);
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
  }
  .modal h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 24px;
    margin: 0 0 8px;
    font-weight: 600;
  }
  .modal p { color: var(--ink-soft); font-size: 13px; margin: 0 0 14px; line-height: 1.5; }
  .modal input {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px 12px;
    font: inherit;
    font-size: 13px;
    margin-bottom: 12px;
    outline: none;
  }
  .modal input:focus { border-color: var(--accent); }
  .modal-buttons { display: flex; gap: 8px; justify-content: flex-end; }

  /* TABS */
  .tabs {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--line);
    margin-bottom: 24px;
  }
  .tab {
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    padding: 10px 18px;
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    cursor: pointer;
    margin-bottom: -1px;
    transition: all 0.15s;
  }
  .tab:hover { color: var(--ink); }
  .tab.active {
    color: var(--accent-deep);
    border-bottom-color: var(--accent);
    font-weight: 600;
  }
  .tab .count {
    display: inline-block;
    margin-left: 6px;
    background: var(--line-soft);
    color: var(--ink-soft);
    font-size: 11px;
    padding: 1px 7px;
    border-radius: 10px;
  }
  .tab.active .count { background: var(--accent); color: #fff; }

  /* GRAND TOTAL BAR */
  .grand-total {
    background: var(--ink);
    color: var(--bg);
    padding: 14px 20px;
    border-radius: 8px;
    margin-bottom: 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  .grand-total .label {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    opacity: 0.7;
  }
  .grand-total .value {
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px;
    font-weight: 600;
    color: var(--accent);
  }
  .grand-total .breakdown {
    font-size: 12px;
    opacity: 0.8;
    font-variant-numeric: tabular-nums;
  }

  /* EXPENSES TABLE - simpler than cotação */
  .expenses-table th.col-desc { width: auto; }
  .expenses-table th.col-value { width: 160px; }

  /* MOBILE */
  @media (max-width: 700px) {
    .app { padding: 12px 10px 100px; }
    .summary { grid-template-columns: repeat(2, 1fr); }
    .stat .value { font-size: 18px; }
    header { padding: 12px 0 18px; margin-bottom: 16px; }
    .grand-total { padding: 12px 14px; }
    .grand-total .value { font-size: 22px; }
    .tab { padding: 10px 12px; font-size: 12px; }
    .chat-panel {
      bottom: 0; right: 0; left: 0;
      width: 100%; max-width: 100%;
      border-radius: 12px 12px 0 0;
      height: 80vh;
    }
    .sync-status { font-size: 10px; }
  }

  /* SYNC STATUS */
  .sync-status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
    margin-left: auto;
    padding: 4px 10px;
    border-radius: 12px;
    background: var(--bg-paper);
    border: 1px solid var(--line);
    transition: all 0.3s;
  }
  .sync-status .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--ink-soft);
    transition: background 0.3s;
  }
  .sync-status.synced .dot { background: var(--green); box-shadow: 0 0 6px rgba(74,124,78,0.5); }
  .sync-status.saving .dot {
    background: var(--accent);
    animation: pulse 1.2s infinite;
  }
  .sync-status.offline .dot { background: var(--red); }
  .sync-status.loading .dot {
    background: var(--accent);
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.3); }
  }

  .toolbar { align-items: center; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

// ============== INITIAL DATA ==============
const INITIAL_ITEMS = [
  { qty: 1, name: "Ibá branco para Oxalá" },
  { qty: 1, name: "Ibá branco para Guian" },

  { qty: 2, name: "Cornos" },
  { qty: 1, name: "Miçangas azul claro leitosa (500g)" },
  { qty: 1, name: "Miçanga verde leitosa (50g)" },
  { qty: 6, name: "Firmas brancas rajada de azul claro" },
  { qty: 2, name: "Firmas verde leitosa" },
  { qty: 1, name: "Xaôro prateado" },
  { qty: 1, name: "Pombo miniatura de chumbo" },
  { qty: 1, name: "Pilão miniatura de chumbo" },
  { qty: 1, name: "Abebê dourado miniatura" },
  { qty: 3, name: "Conchas bonitas" },

  { qty: 1, name: "Búzios médios (200g)" },
  { qty: 2, name: "Favas de Oxalá" },

  { qty: 3, name: "Pembas verdes" },
  { qty: 3, name: "Pembas vermelhas" },
  { qty: 3, name: "Pembas amarelas" },

  { qty: 5, name: "Pembas marrons" },
  { qty: 3, name: "Pembas roxas" },
  { qty: 4, name: "Obis e Orobôs" },
  { qty: 1, name: "Pacote de velas de 7 dias com 10" },
  { qty: 5, name: "Pacotes de velas finas" },
  { qty: 2, name: "Decisas" },
  { qty: 1, name: "Cabrito branco" },
  { qty: 7, name: "Frangos" },
  { qty: 3, name: "Frangas" },
  { qty: 1, name: "D'angola branca" },
  { qty: 1, name: "Pombo claro" },
  { qty: 1, name: "Pombo branco" },
];

const STORAGE_KEY = "candomble_orcamento_v1";
const APP_PASSWORD_STORAGE = "app_password";

// ============== HELPERS ==============
const newRow = (qty=1, name="", prices=[null,null,null,null]) => ({
  id: crypto.randomUUID(),
  qty, name,
  prices: [...prices],
});

const newExpense = (description="", value=null) => ({
  id: crypto.randomUUID(),
  description, value,
});

const formatBRL = (n) => {
  if (n == null || isNaN(n)) return "—";
  return n.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
};

const parsePrice = (s) => {
  if (s === "" || s == null) return null;
  if (typeof s === "number") return s;
  // accept "15", "15,50", "15.50", "R$ 15,50"
  const cleaned = String(s).replace(/[^\d,.-]/g, "").replace(/\./g, "").replace(",", ".");
  const n = parseFloat(cleaned);
  return isNaN(n) ? null : n;
};

// fuzzy find item by name (case insensitive, accent insensitive, partial)
const norm = (s) => (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
const findItemIndex = (items, query) => {
  const q = norm(query);
  if (!q) return -1;
  // exact
  let idx = items.findIndex(it => norm(it.name) === q);
  if (idx >= 0) return idx;
  // contains
  idx = items.findIndex(it => norm(it.name).includes(q) || q.includes(norm(it.name)));
  if (idx >= 0) return idx;
  // word overlap
  const qWords = q.split(/\s+/).filter(w => w.length > 2);
  let best = -1, bestScore = 0;
  items.forEach((it, i) => {
    const nm = norm(it.name);
    const score = qWords.filter(w => nm.includes(w)).length;
    if (score > bestScore) { bestScore = score; best = i; }
  });
  return bestScore >= Math.max(1, Math.floor(qWords.length/2)) ? best : -1;
};

const findStoreIndex = (storeNames, query) => {
  const q = norm(query);
  if (!q) return -1;
  let idx = storeNames.findIndex(n => norm(n) === q);
  if (idx >= 0) return idx;
  idx = storeNames.findIndex(n => norm(n).includes(q) || q.includes(norm(n)));
  return idx;
};

// ============== STATE PERSISTENCE ==============
// Mantemos um cache local pra "primeira renderização" instantânea
// (e pra fallback caso o Supabase esteja inacessível).
const loadStateLocal = () => {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);

      const parsed = JSON.parse(raw);
      if (parsed.items && parsed.stores) {
        return {
          items: parsed.items,
          stores: parsed.stores,
          expenses: parsed.expenses || [],
        };
      }
    }
  } catch (e) {}
  return {
    items: INITIAL_ITEMS.map(it => newRow(it.qty, it.name)),
    stores: ["Loja 1", "Loja 2", "Loja 3", "Loja 4"],
    expenses: [],
  };
};

const saveStateLocal = (state) => {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {}
};

// ============== SUPABASE SYNC ==============
// ID único do registro no banco (uso pessoal: um único registro "main")
const RECORD_ID = "main";
const TABLE = "orcamento";

// Identificador deste dispositivo/aba (pra não reagir aos próprios eventos Realtime)
const CLIENT_ID = (() => {
  try {
    let id = sessionStorage.getItem("client_id");
    if (!id) {
      id = crypto.randomUUID();
      sessionStorage.setItem("client_id", id);
    }
    return id;
  } catch (e) {
    return crypto.randomUUID();
  }
})();

// Inicializa o cliente Supabase (busca credenciais do nosso /api/config)
let _supabaseClient = null;
let _supabaseInitPromise = null;

const initSupabase = () => {
  if (_supabaseInitPromise) return _supabaseInitPromise;
  _supabaseInitPromise = (async () => {
    try {
      const resp = await fetch("/api/config");
      if (!resp.ok) throw new Error("Falha ao buscar config");
      const { supabaseUrl, supabaseAnonKey } = await resp.json();
      if (!supabaseUrl || !supabaseAnonKey) throw new Error("Credenciais ausentes");
      // window.supabase é exposto pelo script CDN
      _supabaseClient = window.supabase.createClient(supabaseUrl, supabaseAnonKey, {
        realtime: { params: { eventsPerSecond: 5 } },
      });
      return _supabaseClient;
    } catch (e) {
      console.error("Supabase init error:", e);
      throw e;
    }
  })();
  return _supabaseInitPromise;
};

const getSupabase = () => _supabaseClient;

// Carrega o estado do banco
const fetchRemoteState = async () => {
  const sb = await initSupabase();
  const { data, error } = await sb
    .from(TABLE)
    .select("data, updated_at")
    .eq("id", RECORD_ID)
    .maybeSingle();
  if (error) throw error;
  if (!data) return null;
  const d = data.data || {};
  return {
    items: Array.isArray(d.items) ? d.items : [],
    stores: Array.isArray(d.stores) && d.stores.length === 4
      ? d.stores
      : ["Loja 1", "Loja 2", "Loja 3", "Loja 4"],
    expenses: Array.isArray(d.expenses) ? d.expenses : [],
    updated_at: data.updated_at,
  };
};

// Salva o estado completo (upsert)
const saveRemoteState = async (state) => {
  const sb = await initSupabase();
  const payload = {
    items: state.items,
    stores: state.stores,
    expenses: state.expenses,
    _client_id: CLIENT_ID, // marcador pra ignorar na escuta Realtime
  };
  const { error } = await sb
    .from(TABLE)
    .upsert({ id: RECORD_ID, data: payload, updated_at: new Date().toISOString() });
  if (error) throw error;
};

// ============== BACKUP / RESTORE ==============
const BACKUPS_TABLE = "orcamento_backups";
const LAST_BACKUP_KEY = "last_auto_backup_at";

// Cria um snapshot no banco
const createBackup = async (state, label = null) => {
  const sb = await initSupabase();
  const payload = {
    items: state.items,
    stores: state.stores,
    expenses: state.expenses,
  };
  const { data, error } = await sb
    .from(BACKUPS_TABLE)
    .insert({ data: payload, label })
    .select()
    .single();
  if (error) throw error;
  return data;
};

// Lista os últimos backups (mais recentes primeiro)
const listBackups = async (limit = 50) => {
  const sb = await initSupabase();
  const { data, error } = await sb
    .from(BACKUPS_TABLE)
    .select("id, created_at, label, data")
    .order("created_at", { ascending: false })
    .limit(limit);
  if (error) throw error;
  return data || [];
};

// Apaga um backup
const deleteBackup = async (id) => {
  const sb = await initSupabase();
  const { error } = await sb.from(BACKUPS_TABLE).delete().eq("id", id);
  if (error) throw error;
};

// Apaga backups com mais de 30 dias (limpeza automática)
const cleanOldBackups = async () => {
  const sb = await initSupabase();
  const cutoff = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000).toISOString();
  await sb.from(BACKUPS_TABLE).delete().lt("created_at", cutoff);
};

// Backup automático: 1x ao dia (se já tiver feito hoje, não faz)
const ensureDailyBackup = async (state) => {
  try {
    const last = localStorage.getItem(LAST_BACKUP_KEY);
    const today = new Date().toDateString(); // ex: "Mon May 06 2026"
    if (last === today) return false; // já fez backup hoje
    // Faz o backup automático
    await createBackup(state, "Automático diário");
    localStorage.setItem(LAST_BACKUP_KEY, today);
    // Aproveita pra limpar antigos
    cleanOldBackups().catch(() => {});
    return true;
  } catch (e) {
    console.error("Erro no backup automático:", e);
    return false;
  }
};

// Formata data pra exibição
const formatBackupDate = (iso) => {
  try {
    const d = new Date(iso);
    return d.toLocaleString("pt-BR", {
      day: "2-digit", month: "2-digit", year: "numeric",
      hour: "2-digit", minute: "2-digit",
    });
  } catch (e) {
    return iso;
  }
};

// ============== EXPORT / IMPORT JSON ==============
const downloadJSON = (state) => {
  const payload = {
    version: 1,
    exported_at: new Date().toISOString(),
    items: state.items,
    stores: state.stores,
    expenses: state.expenses,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const ts = new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-");
  a.href = url;
  a.download = `orcamento-feitura-${ts}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
};

const parseImportedJSON = (text) => {
  const obj = JSON.parse(text);
  // aceita formato exportado (com items/stores/expenses no topo)
  // ou formato bruto (mesma estrutura aninhada em "data")
  const src = obj.data || obj;
  if (!Array.isArray(src.items)) throw new Error("Arquivo inválido: faltam itens");
  return {
    items: src.items,
    stores: Array.isArray(src.stores) && src.stores.length === 4
      ? src.stores
      : ["Loja 1", "Loja 2", "Loja 3", "Loja 4"],
    expenses: Array.isArray(src.expenses) ? src.expenses : [],
  };
};

// ============== APP ==============
function App() {
  // Estado inicial vem do localStorage (instantâneo) — depois é sobrescrito pelo Supabase
  const initial = useMemo(() => loadStateLocal(), []);
  const [items, setItems] = useState(initial.items);
  const [stores, setStores] = useState(initial.stores);
  const [expenses, setExpenses] = useState(initial.expenses || []);
  const [activeTab, setActiveTab] = useState("cotacao"); // "cotacao" | "gastos"
  const [chatOpen, setChatOpen] = useState(false);
  const [appPassword, setAppPassword] = useState(() => localStorage.getItem(APP_PASSWORD_STORAGE) || "");
  const [showKeyModal, setShowKeyModal] = useState(false);
  // Modal de confirmação destrutiva (pede senha pra resetar/limpar)
  const [destructiveAction, setDestructiveAction] = useState(null); // { title, message, onConfirm }
  // Modal de backups
  const [backupsOpen, setBackupsOpen] = useState(false);
  const importFileRef = useRef();

  // Sincronização: status visível pro usuário
  // "loading" | "synced" | "saving" | "offline"
  const [syncStatus, setSyncStatus] = useState("loading");

  // Refs pra controlar fluxo de sincronização
  const isApplyingRemoteRef = useRef(false);  // ignora autosave quando o estado vem do banco
  const saveTimerRef = useRef(null);          // debounce de saves
  const initialLoadDoneRef = useRef(false);   // só ativa autosave após primeiro fetch

  // ====== CARREGA DO SUPABASE NO INÍCIO ======
  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const remote = await fetchRemoteState();
        if (cancelled) return;
        if (remote && (remote.items.length > 0 || remote.expenses.length > 0
            || JSON.stringify(remote.stores) !== JSON.stringify(["Loja 1","Loja 2","Loja 3","Loja 4"]))) {
          // Banco tem dados → usa eles
          isApplyingRemoteRef.current = true;
          setItems(remote.items);
          setStores(remote.stores);
          setExpenses(remote.expenses);
          setTimeout(() => { isApplyingRemoteRef.current = false; }, 50);
        } else {
          // Banco vazio → primeira vez. Se tem dados locais, sobe pro banco.
          // Se não tem dados locais, sobe a lista inicial padrão.
          const local = loadStateLocal();
          const hasLocalData = local.items.length > 0 || local.expenses.length > 0;
          if (!hasLocalData) {
            // Aplica lista inicial padrão (com IDs novos)
            const defaultItems = INITIAL_ITEMS.map(it => newRow(it.qty, it.name));
            isApplyingRemoteRef.current = true;
            setItems(defaultItems);
            setTimeout(() => { isApplyingRemoteRef.current = false; }, 50);
          }
          // Salva o que tiver no banco (será disparado pelo autosave abaixo)
        }
        setSyncStatus("synced");
      } catch (e) {
        console.error("Erro ao carregar do Supabase:", e);
        if (!cancelled) setSyncStatus("offline");
      } finally {
        if (!cancelled) initialLoadDoneRef.current = true;
      }
    })();
    return () => { cancelled = true; };
  }, []);

  // ====== BACKUP AUTOMÁTICO DIÁRIO ======
  // Roda 1 vez por dia, depois que o estado já foi carregado/sincronizado
  useEffect(() => {
    if (!initialLoadDoneRef.current) return;
    // Espera 5s depois do load pra não congestionar a inicialização
    const timer = setTimeout(() => {
      // Só faz backup se tiver dados de verdade
      if (items.length === 0 && expenses.length === 0) return;
      ensureDailyBackup({ items, stores, expenses }).catch(() => {});
    }, 5000);
    return () => clearTimeout(timer);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [initialLoadDoneRef.current]);

  // ====== ESCUTA REALTIME ======
  useEffect(() => {
    let channel = null;
    let cancelled = false;
    (async () => {
      try {
        const sb = await initSupabase();
        if (cancelled) return;
        channel = sb
          .channel("orcamento-realtime")
          .on(
            "postgres_changes",
            { event: "*", schema: "public", table: TABLE, filter: `id=eq.${RECORD_ID}` },
            (payload) => {
              const newData = payload.new?.data;
              if (!newData) return;
              // Se foi este próprio cliente que escreveu, ignora
              if (newData._client_id === CLIENT_ID) return;
              // Aplica mudança remota sem disparar novo save
              isApplyingRemoteRef.current = true;
              if (Array.isArray(newData.items)) setItems(newData.items);
              if (Array.isArray(newData.stores) && newData.stores.length === 4) setStores(newData.stores);
              if (Array.isArray(newData.expenses)) setExpenses(newData.expenses);
              setTimeout(() => { isApplyingRemoteRef.current = false; }, 50);
              // Pequeno flash visual de "sincronizado"
              setSyncStatus("synced");
            }
          )
          .subscribe();
      } catch (e) {
        console.error("Erro ao iniciar Realtime:", e);
      }
    })();
    return () => {
      cancelled = true;
      if (channel) {
        try { getSupabase()?.removeChannel(channel); } catch (e) {}
      }
    };
  }, []);

  // ====== AUTOSAVE COM DEBOUNCE ======
  useEffect(() => {
    // Sempre salva no localStorage (cache instantâneo)
    saveStateLocal({ items, stores, expenses });

    // Não salva no banco se ainda não fez o primeiro carregamento
    if (!initialLoadDoneRef.current) return;
    // Não salva no banco se a mudança veio do próprio Realtime
    if (isApplyingRemoteRef.current) return;

    setSyncStatus("saving");
    if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
    saveTimerRef.current = setTimeout(async () => {
      try {
        await saveRemoteState({ items, stores, expenses });
        setSyncStatus("synced");
      } catch (e) {
        console.error("Erro ao salvar:", e);
        setSyncStatus("offline");
      }
    }, 600); // 600ms de debounce — agrupa edições rápidas

    return () => {
      if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
    };
  }, [items, stores, expenses]);

  // --- summary calc ---
  const summary = useMemo(() => {
    let totalLowest = 0;
    let quoted = 0;
    const storesActive = new Set();
    let totalAllPrices = 0;
    let pricesCount = 0;
    let totalHighest = 0;

    items.forEach(it => {
      const valid = it.prices.map((p,i) => ({p, i})).filter(x => x.p != null && !isNaN(x.p) && x.p > 0);
      if (valid.length > 0) {
        quoted++;
        const min = Math.min(...valid.map(x => x.p));
        const max = Math.max(...valid.map(x => x.p));
        totalLowest += min * (it.qty || 1);
        totalHighest += max * (it.qty || 1);
        valid.forEach(x => storesActive.add(x.i));
      }
    });
    const economy = totalHighest - totalLowest;
    return {
      totalLowest, quoted, total: items.length,
      storesActive: storesActive.size, economy,
    };
  }, [items]);

  const expensesTotal = useMemo(() => {
    return expenses.reduce((sum, e) => sum + (e.value || 0), 0);
  }, [expenses]);

  const grandTotal = summary.totalLowest + expensesTotal;

  // --- expenses ops ---
  const updateExpense = (id, patch) => {
    setExpenses(prev => prev.map(e => e.id === id ? { ...e, ...patch } : e));
  };
  const updateExpenseValue = (id, raw) => {
    setExpenses(prev => prev.map(e => e.id === id
      ? { ...e, value: raw === "" ? null : parsePrice(raw) }
      : e));
  };
  const deleteExpense = (id) => setExpenses(prev => prev.filter(e => e.id !== id));
  const addExpense = () => setExpenses(prev => [...prev, newExpense("", null)]);
  const clearExpenses = () => {
    setDestructiveAction({
      title: "Limpar gastos avulsos",
      message: "Vai apagar TODOS os gastos avulsos. Digite a senha do app pra confirmar.",
      onConfirm: () => setExpenses([]),
    });
  };

  // --- table ops ---
  const updateItem = (id, patch) => {
    setItems(prev => prev.map(it => it.id === id ? { ...it, ...patch } : it));
  };
  const updatePrice = (id, storeIdx, raw) => {
    setItems(prev => prev.map(it => {
      if (it.id !== id) return it;
      const prices = [...it.prices];
      prices[storeIdx] = raw === "" ? null : parsePrice(raw);
      return { ...it, prices };
    }));
  };
  const deleteRow = (id) => setItems(prev => prev.filter(it => it.id !== id));
  const addRow = () => setItems(prev => [...prev, newRow(1, "")]);
  const renameStore = (idx, name) => {
    setStores(prev => prev.map((s,i) => i===idx ? name : s));
  };
  const resetAll = () => {
    setDestructiveAction({
      title: "Resetar tudo",
      message: "Vai apagar TODAS as cotações e voltar à lista original. Digite a senha do app pra confirmar.",
      onConfirm: () => {
        setItems(INITIAL_ITEMS.map(it => newRow(it.qty, it.name)));
        setStores(["Loja 1", "Loja 2", "Loja 3", "Loja 4"]);
      },
    });
  };
  const clearPrices = () => {
    setDestructiveAction({
      title: "Limpar preços",
      message: "Vai apagar TODOS os preços (mantém a lista de itens). Digite a senha do app pra confirmar.",
      onConfirm: () => {
        setItems(prev => prev.map(it => ({ ...it, prices: [null,null,null,null] })));
      },
    });
  };

  // --- backup / restore / export / import ---
  const handleExport = () => {
    downloadJSON({ items, stores, expenses });
  };

  const handleImportClick = () => {
    importFileRef.current?.click();
  };

  const handleImportFile = (e) => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const parsed = parseImportedJSON(ev.target.result);
        setDestructiveAction({
          title: "Importar arquivo",
          message: `Vai SUBSTITUIR os dados atuais pelo conteúdo do arquivo (${parsed.items.length} itens, ${parsed.expenses.length} gastos). Digite a senha pra confirmar.`,
          onConfirm: () => {
            // Cria backup antes de substituir
            createBackup({ items, stores, expenses }, "Antes de importar arquivo").catch(() => {});
            setItems(parsed.items);
            setStores(parsed.stores);
            setExpenses(parsed.expenses);
          },
        });
      } catch (err) {
        alert("Arquivo inválido: " + err.message);
      }
    };
    reader.readAsText(file);
  };

  const restoreBackup = (backup) => {
    setDestructiveAction({
      title: "Restaurar backup",
      message: `Vai SUBSTITUIR os dados atuais pelo backup de ${formatBackupDate(backup.created_at)}. Digite a senha pra confirmar.`,
      onConfirm: () => {
        // Antes de restaurar, salva o estado atual como backup
        createBackup({ items, stores, expenses }, "Antes de restaurar").catch(() => {});
        const d = backup.data || {};
        if (Array.isArray(d.items)) setItems(d.items);
        if (Array.isArray(d.stores) && d.stores.length === 4) setStores(d.stores);
        if (Array.isArray(d.expenses)) setExpenses(d.expenses);
        setBackupsOpen(false);
      },
    });
  };

  // --- AI actions: applied to state ---
  // actions = [{type: "set_price", item, store, price}, {type:"add_item", name, qty, price?, store?}, {type:"remove_item", item}, {type:"rename_item", item, new_name}, {type:"set_qty", item, qty}, {type:"rename_store", store, new_name}]
  const applyActions = (actions) => {
    if (!actions || !actions.length) return [];
    const applied = [];
    let curItems = items.map(i => ({...i, prices:[...i.prices]}));
    let curStores = [...stores];
    let curExpenses = expenses.map(e => ({...e}));

    for (const a of actions) {
      try {
        if (a.type === "set_price") {
          const price = parsePrice(a.price);
          if (price == null) { applied.push(`✗ Preço inválido para "${a.item}"`); continue; }
          let idx = findItemIndex(curItems, a.item);
          if (idx < 0) {
            const row = newRow(a.qty || 1, a.item);
            curItems = [...curItems, row];
            idx = curItems.length - 1;
            applied.push(`+ Item criado: ${a.item}`);
          }
          const sIdx = a.store ? findStoreIndex(curStores, a.store) : -1;
          const storeIdx = sIdx >= 0 ? sIdx : 0;
          const prices = [...curItems[idx].prices];
          prices[storeIdx] = price;
          curItems[idx] = { ...curItems[idx], prices };
          applied.push(`✓ ${formatBRL(price)} em "${curItems[idx].name}" → ${curStores[storeIdx]}`);
        }
        else if (a.type === "add_item") {
          const exists = findItemIndex(curItems, a.name);
          if (exists >= 0) {
            if (a.price != null && a.store) {
              const sIdx = findStoreIndex(curStores, a.store);
              if (sIdx >= 0) {
                const prices = [...curItems[exists].prices];
                prices[sIdx] = parsePrice(a.price);
                curItems[exists] = { ...curItems[exists], prices };
                applied.push(`✓ ${formatBRL(parsePrice(a.price))} em "${curItems[exists].name}" → ${curStores[sIdx]}`);
              }
            } else {
              applied.push(`• Já existe: "${a.name}"`);
            }
          } else {
            const prices = [null,null,null,null];
            if (a.price != null && a.store) {
              const sIdx = findStoreIndex(curStores, a.store);
              if (sIdx >= 0) prices[sIdx] = parsePrice(a.price);
            }
            curItems = [...curItems, newRow(a.qty || 1, a.name, prices)];
            applied.push(`+ Adicionado: ${a.name}` + (a.price != null ? ` (${formatBRL(parsePrice(a.price))})` : ""));
          }
        }
        else if (a.type === "remove_item") {
          const idx = findItemIndex(curItems, a.item);
          if (idx >= 0) {
            const removed = curItems[idx].name;
            curItems = curItems.filter((_, i) => i !== idx);
            applied.push(`− Removido: ${removed}`);
          } else {
            applied.push(`✗ Não encontrado: "${a.item}"`);
          }
        }
        else if (a.type === "rename_item") {
          const idx = findItemIndex(curItems, a.item);
          if (idx >= 0) {
            const old = curItems[idx].name;
            curItems[idx] = { ...curItems[idx], name: a.new_name };
            applied.push(`✎ "${old}" → "${a.new_name}"`);
          }
        }
        else if (a.type === "set_qty") {
          const idx = findItemIndex(curItems, a.item);
          if (idx >= 0) {
            curItems[idx] = { ...curItems[idx], qty: parseInt(a.qty) || 1 };
            applied.push(`✎ Qtd "${curItems[idx].name}": ${a.qty}`);
          }
        }
        else if (a.type === "rename_store") {
          const sIdx = findStoreIndex(curStores, a.store);
          if (sIdx >= 0) {
            const old = curStores[sIdx];
            curStores = curStores.map((s,i) => i === sIdx ? a.new_name : s);
            applied.push(`✎ Loja "${old}" → "${a.new_name}"`);
          }
        }
        else if (a.type === "add_expense") {
          const value = parsePrice(a.value);
          if (value == null) { applied.push(`✗ Valor inválido para "${a.description}"`); continue; }
          curExpenses = [...curExpenses, newExpense(a.description || "Gasto", value)];
          applied.push(`+ Gasto: ${a.description} (${formatBRL(value)})`);
        }
        else if (a.type === "remove_expense") {
          const q = norm(a.description);
          const idx = curExpenses.findIndex(e => norm(e.description) === q
            || norm(e.description).includes(q)
            || q.includes(norm(e.description)));
          if (idx >= 0) {
            const removed = curExpenses[idx];
            curExpenses = curExpenses.filter((_, i) => i !== idx);
            applied.push(`− Gasto removido: ${removed.description}`);
          } else {
            applied.push(`✗ Gasto não encontrado: "${a.description}"`);
          }
        }
        else if (a.type === "set_expense_value") {
          const value = parsePrice(a.value);
          const q = norm(a.description);
          const idx = curExpenses.findIndex(e => norm(e.description) === q
            || norm(e.description).includes(q)
            || q.includes(norm(e.description)));
          if (idx >= 0 && value != null) {
            curExpenses[idx] = { ...curExpenses[idx], value };
            applied.push(`✎ Gasto "${curExpenses[idx].description}": ${formatBRL(value)}`);
          } else {
            applied.push(`✗ Gasto não encontrado ou valor inválido: "${a.description}"`);
          }
        }
      } catch (e) {
        applied.push(`✗ Erro: ${e.message}`);
      }
    }

    setItems(curItems);
    setStores(curStores);
    setExpenses(curExpenses);
    return applied;
  };

  // figure out lowest price column per row
  const lowestStoreIdx = (row) => {
    const valid = row.prices.map((p,i) => ({p,i})).filter(x => x.p != null && x.p > 0);
    if (valid.length < 1) return -1;
    return valid.reduce((min, x) => x.p < min.p ? x : min, valid[0]).i;
  };

  // ======= Password =======
  const ensurePassword = () => {
    if (!appPassword) { setShowKeyModal(true); return false; }
    return true;
  };

  return (
    <div className="app">
      <header>
        <h1>Orçamento <span className="ornament">de Feitura</span></h1>

          </div>
        </div>

      </div>

      {/* TABS */}
      <div className="tabs">
        <button
          className={`tab ${activeTab === "cotacao" ? "active" : ""}`}
          onClick={() => setActiveTab("cotacao")}
        >
          Cotação <span className="count">{items.length}</span>
        </button>
        <button
          className={`tab ${activeTab === "gastos" ? "active" : ""}`}
          onClick={() => setActiveTab("gastos")}
        >
          Gastos avulsos <span className="count">{expenses.length}</span>
        </button>
      </div>

      {activeTab === "cotacao" && (
        <>
          {/* SUMMARY */}
          <div className="summary">
            <div className="stat">
              <div className="label">Total (menor preço)</div>
              <div className="value green">{formatBRL(summary.totalLowest)}</div>
            </div>
            <div className="stat">
              <div className="label">Itens cotados</div>
              <div className="value">{summary.quoted}<span style={{fontSize:14,color:'var(--ink-soft)'}}> / {summary.total}</span></div>
            </div>
            <div className="stat">
              <div className="label">Lojas ativas</div>
              <div className="value">{summary.storesActive}<span style={{fontSize:14,color:'var(--ink-soft)'}}> / 4</span></div>
            </div>
            <div className="stat">
              <div className="label">Economia estimada</div>
              <div className="value gold">{formatBRL(summary.economy)}</div>
            </div>
          </div>

          {/* TOOLBAR */}
          <div className="toolbar">
            <button className="btn primary" onClick={addRow}>＋ Novo item</button>
            <button className="btn" onClick={() => setShowKeyModal(true)}>
              {appPassword ? "🔓 Trocar senha" : "🔒 Acessar IA"}
            </button>
            <button className="btn" onClick={() => setBackupsOpen(true)} title="Ver e restaurar backups">
              💾 Backups
            </button>
            <button className="btn" onClick={handleExport} title="Baixar JSON">
              ⬇ Exportar
            </button>
            <button className="btn" onClick={handleImportClick} title="Restaurar de arquivo JSON">
              ⬆ Importar
            </button>
            <input
              ref={importFileRef}
              type="file"
              accept="application/json,.json"
              onChange={handleImportFile}
              style={{display: 'none'}}

          </div>

          {/* TABLE */}
          <div className="table-wrap">
            <div className="table-scroll">
              <table>
                <thead>
                  <tr>
                    <th className="col-qty">Qtd</th>
                    <th className="col-item">Item</th>
                    {stores.map((s, i) => (
                      <th key={i} className="col-store">
                        <input
                          className="store-name-input"

                  {items.map(row => {
                    const lowIdx = lowestStoreIdx(row);
                    return (
                      <tr key={row.id}>
                        <td>
                          <input
                            className="cell-input qty"
                            type="number" min="1"

                        </td>
                        <td>
                          <input
                            className="cell-input"
                            value={row.name}
                            onChange={e => updateItem(row.id, { name: e.target.value })}

                              className="cell-input price"

                        <td>
                          <button className="row-action-btn" onClick={() => deleteRow(row.id)} title="Remover linha">×</button>
                        </td>
                      </tr>
                    );
                  })}
                  {items.length === 0 && (

                      Nenhum item. Clique em "Novo item" ou peça pra IA adicionar.

      {activeTab === "gastos" && (

              <div className="label">Total dos gastos avulsos</div>

            </div>
            <div className="stat">
              <div className="label">Quantidade de gastos</div>
              <div className="value">{expenses.length}</div>
            </div>
          </div>

          {/* TOOLBAR */}
          <div className="toolbar">
            <button className="btn primary" onClick={addExpense}>＋ Novo gasto</button>

                      <td>
                        <button className="row-action-btn" onClick={() => deleteExpense(e.id)} title="Remover">×</button>
                      </td>
                    </tr>
                  ))}
                  {expenses.length === 0 && (
                    <tr><td colSpan="3" style={{textAlign:'center', padding:'24px', color:'var(--ink-soft)', fontStyle:'italic'}}>

                    </td></tr>
                  )}

              </table>
            </div>
          </div>
        </>
      )}

      {/* CHAT */}
      {!chatOpen && (
        <button className="chat-fab" onClick={() => setChatOpen(true)} title="Chat com IA">

        </button>
      )}
      {chatOpen && (
        <ChatPanel
          onClose={() => setChatOpen(false)}

          ensurePassword={ensurePassword}

      {showKeyModal && (
        <PasswordModal

            if (k) localStorage.setItem(APP_PASSWORD_STORAGE, k);

            setShowKeyModal(false);
          }}
          onCancel={() => setShowKeyModal(false)}
        />
      )}

      {destructiveAction && (
        <DestructiveConfirmModal
          title={destructiveAction.title}
          message={destructiveAction.message}
          appPassword={appPassword}
          onNeedPassword={() => {
            setDestructiveAction(null);
            setShowKeyModal(true);
          }}
          onConfirm={() => {
            destructiveAction.onConfirm();
            setDestructiveAction(null);
          }}
          onCancel={() => setDestructiveAction(null)}
        />
      )}

      {backupsOpen && (
        <BackupsModal
          currentState={{ items, stores, expenses }}
          onRestore={restoreBackup}

    </div>
  );
}

// ============== PASSWORD MODAL ==============
function PasswordModal({ currentPassword, onSave, onCancel }) {
  const [val, setVal] = useState(currentPassword || "");
  return (
    <div className="modal-bg" onClick={onCancel}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <h2>Senha de acesso</h2>
        <p>
          Digite a senha do app para liberar o chat com IA. A senha fica salva
          neste navegador. Se não souber, peça pra quem configurou o app.
        </p>
        <input
          type="password"
          placeholder="senha"
          value={val}
          onChange={e => setVal(e.target.value)}
          autoFocus
          onKeyDown={e => { if (e.key === "Enter") onSave(val.trim()); }}
        />
        <div className="modal-buttons">
          <button className="btn" onClick={onCancel}>Cancelar</button>
          <button className="btn primary" onClick={() => onSave(val.trim())}>Salvar</button>
        </div>
      </div>
    </div>
  );
}

// ============== DESTRUCTIVE CONFIRM MODAL (com senha) ==============
function DestructiveConfirmModal({ title, message, appPassword, onNeedPassword, onConfirm, onCancel }) {
  const [val, setVal] = useState("");
  const [error, setError] = useState("");

  // Se ainda não tem senha configurada, abre o modal de senha em vez deste
  useEffect(() => {
    if (!appPassword) {
      onNeedPassword();
    }
  }, [appPassword]);

  if (!appPassword) return null;

  const tryConfirm = () => {
    if (val.trim() === appPassword) {
      onConfirm();
    } else {
      setError("Senha incorreta");
      setVal("");
    }
  };

  return (
    <div className="modal-bg" onClick={onCancel}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <h2 style={{color: 'var(--red)'}}>⚠️ {title}</h2>
        <p>{message}</p>
        <input
          type="password"
          placeholder="senha do app"
          value={val}
          onChange={e => { setVal(e.target.value); setError(""); }}
          autoFocus
          onKeyDown={e => { if (e.key === "Enter") tryConfirm(); }}
          style={error ? { borderColor: 'var(--red)' } : {}}
        />
        {error && (
          <p style={{color: 'var(--red)', fontSize: 12, marginTop: -8, marginBottom: 12}}>
            {error}
          </p>
        )}
        <div className="modal-buttons">
          <button className="btn" onClick={onCancel}>Cancelar</button>
          <button className="btn danger" onClick={tryConfirm}>Confirmar</button>
        </div>
      </div>
    </div>
  );
}

// ============== BACKUPS MODAL ==============
function BackupsModal({ currentState, onRestore, onClose }) {
  const [backups, setBackups] = useState(null); // null = loading
  const [error, setError] = useState("");
  const [creating, setCreating] = useState(false);
  const [deletingId, setDeletingId] = useState(null);

  const reload = async () => {
    setError("");
    try {
      const list = await listBackups(50);
      setBackups(list);
    } catch (e) {
      setError("Erro ao carregar backups: " + e.message);
      setBackups([]);
    }
  };

  useEffect(() => { reload(); }, []);

  const handleCreateNow = async () => {
    if (creating) return;
    setCreating(true);
    setError("");
    try {
      await createBackup(currentState, "Manual");
      await reload();
    } catch (e) {
      setError("Erro ao criar backup: " + e.message);
    } finally {
      setCreating(false);
    }
  };

  const handleDelete = async (id) => {
    if (!confirm("Apagar este backup?")) return;
    setDeletingId(id);
    try {
      await deleteBackup(id);
      setBackups(prev => prev.filter(b => b.id !== id));
    } catch (e) {
      setError("Erro ao apagar: " + e.message);
    } finally {
      setDeletingId(null);
    }
  };

  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()} style={{maxWidth: 600, maxHeight: '85vh', display: 'flex', flexDirection: 'column'}}>
        <h2>💾 Backups</h2>
        <p style={{fontSize: 12}}>
          Snapshots do orçamento. Backups manuais e automáticos diários ficam guardados por 30 dias.
        </p>

        <div style={{display: 'flex', gap: 8, marginBottom: 12}}>
          <button
            className="btn primary"
            onClick={handleCreateNow}
            disabled={creating}
          >
            {creating ? "Criando..." : "＋ Criar backup agora"}
          </button>
          <button className="btn" onClick={reload}>↻ Recarregar</button>
        </div>

        {error && (
          <p style={{color: 'var(--red)', fontSize: 12, marginBottom: 8}}>{error}</p>
        )}

        <div style={{
          flex: 1,
          overflowY: 'auto',
          border: '1px solid var(--line)',
          borderRadius: 6,
          background: '#fff',
          minHeight: 200,
          maxHeight: '50vh',
        }}>
          {backups === null && (
            <div style={{padding: 20, textAlign: 'center', color: 'var(--ink-soft)'}}>
              Carregando...
            </div>
          )}
          {backups !== null && backups.length === 0 && (
            <div style={{padding: 20, textAlign: 'center', color: 'var(--ink-soft)', fontStyle: 'italic'}}>
              Nenhum backup ainda. Clique em "Criar backup agora" pra fazer o primeiro.
            </div>
          )}
          {backups !== null && backups.map(b => {
            const itemsCount = b.data?.items?.length || 0;
            const expensesCount = b.data?.expenses?.length || 0;
            return (
              <div key={b.id} style={{
                padding: 10,
                borderBottom: '1px solid var(--line-soft)',
                display: 'flex',
                alignItems: 'center',
                gap: 8,
                flexWrap: 'wrap',
              }}>
                <div style={{flex: 1, minWidth: 180}}>
                  <div style={{fontWeight: 600, fontSize: 13}}>
                    {formatBackupDate(b.created_at)}
                  </div>
                  <div style={{fontSize: 11, color: 'var(--ink-soft)'}}>
                    {b.label || "—"} · {itemsCount} itens · {expensesCount} gastos
                  </div>
                </div>
                <button
                  className="btn"
                  onClick={() => onRestore(b)}
                  style={{fontSize: 12, padding: '4px 10px'}}
                >
                  Restaurar
                </button>
                <button
                  className="btn danger"
                  onClick={() => handleDelete(b.id)}
                  disabled={deletingId === b.id}
                  style={{fontSize: 12, padding: '4px 10px'}}
                >
                  {deletingId === b.id ? "..." : "×"}
                </button>
              </div>
            );
          })}
        </div>

        <div className="modal-buttons" style={{marginTop: 12}}>
          <button className="btn" onClick={onClose}>Fechar</button>
        </div>
      </div>
    </div>
  );
}

// ============== CHAT ==============
const SYSTEM_PROMPT = `Você é um assistente que ajuda a gerenciar uma planilha de orçamento de itens de feitura de candomblé.

A planilha tem DUAS partes:
1. COTAÇÃO: itens com nome e quantidade, e 4 colunas de lojas onde se anotam preços (R$).
2. GASTOS AVULSOS: lista simples de descrição + valor, para gastos que não estão na cotação (ex: mercado, transporte, taxa, contribuição rateada, oferenda, etc).

Você recebe MENSAGENS do usuário em português (texto ou foto de lista manuscrita) e deve retornar um JSON com as ações que devem ser aplicadas.

FORMATO DE RESPOSTA OBRIGATÓRIO (JSON puro, sem markdown, sem \`\`\`):
{
  "reply": "mensagem curta e amigável pro usuário",
  "actions": [ ... lista de ações ... ]
}

AÇÕES NA COTAÇÃO:
- {"type":"set_price","item":"nome do item","store":"nome da loja","price":15.50}
- {"type":"add_item","name":"nome","qty":1,"price":15.50,"store":"nome da loja"}  // price/store opcionais
- {"type":"remove_item","item":"nome do item"}
- {"type":"rename_item","item":"nome atual","new_name":"novo nome"}
- {"type":"set_qty","item":"nome do item","qty":5}
- {"type":"rename_store","store":"nome atual da loja","new_name":"novo nome"}

AÇÕES NOS GASTOS AVULSOS:
- {"type":"add_expense","description":"Mercado","value":700.00}
- {"type":"remove_expense","description":"Mercado"}
- {"type":"set_expense_value","description":"Mercado","value":850.00}

REGRAS:
1. Para preços/valores, sempre use número decimal com ponto (15.50, não "R$ 15,50" nem "15,50").
2. DECIDIR ENTRE COTAÇÃO E GASTO AVULSO:
   - Se o usuário menciona uma loja → COTAÇÃO (set_price).
   - Se a descrição parece um item da lista de feitura (vela, fava, miçanga, etc) → COTAÇÃO.
   - Se for algo genérico que não tá na lista (mercado, uber, transporte, gasolina, taxa, contribuição, oferenda, almoço) → GASTO AVULSO.
   - "Adiciona mercado 700" / "gastei 50 de uber" / "taxa de 100" → add_expense.
   - "R$15 na vela branca, Loja Oxum" → set_price.
3. Para fotos de listas: extraia tudo que aparece. Se for uma lista de compras de loja específica, use set_price. Se forem gastos avulsos misturados, use add_expense.
4. Combine "item" com o nome mais próximo da lista atual quando fizer sentido.
5. Se a mensagem não pede mudança, deixe "actions" vazio.
6. Se uma loja mencionada não existe nas 4 lojas atuais, use rename_store pra renomear uma vazia ou avise no reply.
7. Seja conciso e direto. Não explique demais.`;

function ChatPanel({ onClose, appPassword, ensurePassword, items, stores, expenses, activeTab, applyActions }) {
  const [messages, setMessages] = useState([
    { role: "ai", text: "Olá! Posso preencher a planilha pra você.\n\nCotação:\n• \"R$15 na vela branca, Loja Oxum\"\n• \"Adiciona 3 atabaques por 200 na Loja 1\"\n\nGastos avulsos:\n• \"Adiciona mercado 700 reais\"\n• \"Gastei 50 de uber\"\n• \"Taxa de 150\"\n\nOu envie a foto de uma lista." },
  ]);
  const [input, setInput] = useState("");
  const [pendingImage, setPendingImage] = useState(null);
  const [loading, setLoading] = useState(false);
  const fileRef = useRef();
  const scrollRef = useRef();

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages, loading]);

  const handleImage = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      setPendingImage({
        dataUrl: ev.target.result,
        mediaType: file.type || "image/jpeg",
        base64: ev.target.result.split(",")[1],
      });
    };
    reader.readAsDataURL(file);
    e.target.value = "";
  };

  const buildContext = () => {
    const itemsList = items.map(it => `- (qtd ${it.qty}) ${it.name}`).join("\n");
    const expensesList = expenses.map(e =>
      `- ${e.description}: ${e.value != null ? `R$ ${e.value.toFixed(2)}` : "—"}`
    ).join("\n");
    return `ABA ATIVA: ${activeTab === "cotacao" ? "Cotação" : "Gastos avulsos"}

LISTA ATUAL DE ITENS (cotação):
${itemsList || "(vazia)"}

NOMES DAS LOJAS: ${stores.map((s,i)=>`${i+1}=${s}`).join(", ")}

GASTOS AVULSOS ATUAIS:
${expensesList || "(nenhum)"}`;
  };

  const send = async () => {
    if (loading) return;
    if (!input.trim() && !pendingImage) return;
    if (!ensurePassword()) return;

    const userMsg = { role: "user", text: input, image: pendingImage?.dataUrl };
    setMessages(m => [...m, userMsg]);
    const userInput = input;
    const sentImage = pendingImage;
    setInput("");
    setPendingImage(null);
    setLoading(true);

    try {
      const userContent = [];
      if (sentImage) {
        userContent.push({
          type: "image",
          source: {
            type: "base64",
            media_type: sentImage.mediaType,
            data: sentImage.base64,
          },
        });
      }
      const text = (userInput.trim() ? userInput.trim() + "\n\n" : "") + buildContext();
      userContent.push({ type: "text", text });

      const resp = await fetch("/api/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-app-password": appPassword,
        },
        body: JSON.stringify({
          model: "claude-haiku-4-5",
          max_tokens: 2000,
          system: SYSTEM_PROMPT,
          messages: [{ role: "user", content: userContent }],
        }),
      });

      if (resp.status === 401) {
        // wrong password — clear it and prompt again
        localStorage.removeItem(APP_PASSWORD_STORAGE);
        throw new Error("Senha inválida. Clique em 🔒 Acessar IA pra digitar de novo.");
      }
      if (!resp.ok) {
        const err = await resp.text();
        throw new Error(`Erro ${resp.status}: ${err.slice(0, 200)}`);
      }

      const data = await resp.json();
      const raw = (data.content || [])
        .filter(c => c.type === "text")
        .map(c => c.text)
        .join("\n")
        .trim();

      // strip code fences if any
      let jsonText = raw.replace(/^```(?:json)?\s*/i, "").replace(/\s*```$/i, "").trim();
      // try to find first { ... } block
      const firstBrace = jsonText.indexOf("{");
      const lastBrace = jsonText.lastIndexOf("}");
      if (firstBrace >= 0 && lastBrace > firstBrace) {
        jsonText = jsonText.slice(firstBrace, lastBrace + 1);
      }

      let parsed;
      try {
        parsed = JSON.parse(jsonText);
      } catch (e) {
        setMessages(m => [...m, { role: "ai", text: raw || "(resposta sem formato esperado)" }]);
        return;
      }

      const applied = applyActions(parsed.actions || []);
      setMessages(m => [...m, {
        role: "ai",
        text: parsed.reply || "Pronto!",
        actionsApplied: applied,
      }]);
    } catch (e) {
      setMessages(m => [...m, { role: "ai", text: `Erro: ${e.message}` }]);
    } finally {
      setLoading(false);
    }
  };

  const handleKey = (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  };

  return (
    <div className="chat-panel">
      <div className="chat-header">
        <h3>✦ Assistente</h3>
        <button onClick={onClose}>×</button>
      </div>
      <div className="chat-messages" ref={scrollRef}>
        {messages.map((m, i) => (
          <div key={i} className={`msg ${m.role}`}>
            <div style={{whiteSpace:'pre-wrap'}}>{m.text}</div>
            {m.image && <img src={m.image} alt="enviada" />}
            {m.actionsApplied && m.actionsApplied.length > 0 && (
              <div className="actions-applied">
                {m.actionsApplied.map((a, j) => <div key={j}>{a}</div>)}
              </div>
            )}
          </div>
        ))}
        {loading && (
          <div className="msg ai">
            <div className="typing"><span></span><span></span><span></span></div>
          </div>
        )}
      </div>
      {pendingImage && (
        <div className="image-preview">
          <img src={pendingImage.dataUrl} alt="preview" />
          <span>Imagem pronta pra enviar</span>
          <button
            style={{marginLeft:'auto', background:'none', border:'none', cursor:'pointer', color:'var(--red)'}}
            onClick={() => setPendingImage(null)}
          >×</button>
        </div>
      )}
      <div className="chat-input-area">
        <input ref={fileRef} type="file" accept="image/*" onChange={handleImage} style={{display:'none'}} />
        <button
          className="chat-btn-icon secondary"
          onClick={() => fileRef.current?.click()}
          title="Enviar foto da lista"
          disabled={loading}
        >📷</button>
        <textarea
          className="chat-input"
          placeholder="Ex: R$15 na vela branca, Loja Oxum"
          value={input}
          onChange={e => setInput(e.target.value)}
          onKeyDown={handleKey}
          rows={1}
          disabled={loading}
        />
        <button className="chat-btn-icon" onClick={send} disabled={loading} title="Enviar">↑</button>
      </div>
    </div>
  );
}

// ============== SYNC BADGE ==============
function SyncBadge({ status }) {
  const labels = {
    loading: "Conectando...",
    synced: "Sincronizado",
    saving: "Salvando...",
    offline: "Offline (salvando local)",
  };
  return (
    <div className={`sync-status ${status}`} title="Estado da sincronização entre dispositivos">
      <span className="dot"></span>
      <span>{labels[status] || status}</span>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
